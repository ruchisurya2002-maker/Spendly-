{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expenses_add.css') }}">
{% endblock %}

{% block content %}

<section class="expense-form-section">
    <div class="expense-form-container">

        <div class="expense-form-header">
            <h1 class="expense-form-title">Edit expense</h1>
            <p class="expense-form-subtitle">Update the details of this transaction</p>
        </div>

        <div class="expense-form-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense_id) }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" step="0.01" min="0.01"
                           placeholder="0.00" value="{{ amount }}"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {% if not category %}selected{% endif %}>Select a category</option>
                        {% for c in categories %}
                        <option value="{{ c }}" {% if c == category %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" value="{{ date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Groceries"
                           value="{{ description }}">
                </div>
                <button type="submit" class="btn-submit">Save changes</button>
                <a href="{{ url_for('profile') }}" class="expense-form-cancel">Cancel</a>
            </form>
        </div>

    </div>
</section>

{% endblock %}
